name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: Tests, PHPStan, php-cs-fixer, line length
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - run: composer test
      - run: composer stan
      - run: composer cs-check
      - run: composer lines
